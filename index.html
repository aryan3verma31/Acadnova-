/* ============================= ROUTING ============================= */
// Real per-page URLs (/universities/:id, /professors/:id). Netlify's SPA redirect
// (see netlify.toml) sends every path to this file, so a refresh or a shared link
// lands here and this function restores the right view from the URL itself.
function applyRouteFromLocation(){
  const parts = location.pathname.split("/").filter(Boolean);
  if(parts[0] === "universities" && parts[1]){
    const u = SEED_UNIVERSITIES.find(x=>x.id===parts[1]);
    if(u){
      state.selectedUniversity = u; state.view = "university-detail"; state.detailTab = "overview";
      return;
    }
  }
  if(parts[0] === "outbox"){
    state.view = "outbox"; state.navView = "outbox";
    return;
  }
  if(parts[0] === "scholarships"){
    state.view = "scholarships"; state.navView = "scholarships";
    return;
  }
  if(parts[0] === "professors" && parts[1]){
    const entry = findProfessorById(parts[1]);
    if(entry){
      state.selectedUniversity = entry.uni; state.selectedProfessor = entry.prof; state.view = "professor-profile";
      return;
    }
  }
  state.view = "home";
}

function findProfessorById(id){
  for(const uniId in PROFESSORS){
    const prof = PROFESSORS[uniId].find(p=>p.id===id);
    if(prof) return { prof, uni: SEED_UNIVERSITIES.find(u=>u.id===uniId) };
  }
  return null;
}

function navigateTo(path, title){
  if(location.pathname !== path) history.pushState({}, "", path);
  if(title) document.title = title + " — AcadNova";
  window.scrollTo(0,0);
}

window.addEventListener("popstate", ()=>{ applyRouteFromLocation(); renderApp(); });

/* ============================= RENDER HELPERS ============================= */
function badge(status){
  if(status === "VERIFIED") return `<span class="source-badge" style="background:var(--verified-bg);color:var(--verified)">VERIFIED</span>`;
  if(status === "PARTIALLY_VERIFIED") return `<span class="source-badge" style="background:var(--ai-bg);color:var(--ai)">PARTIALLY VERIFIED</span>`;
  return `<span class="source-badge" style="background:var(--unverified-bg);color:var(--unverified)">NOT VERIFIED</span>`;
}
function linkOrNA(obj, label){
  if(!obj) return `<span class="na">${label}: not publicly listed</span>`;
  return `<a href="${obj.url}" target="_blank" rel="noopener">${label} ↗</a>`;
}

function renderStepper(){
  const steps = [
    ["Country", state.filters.country],
    ["Ranking", state.filters.rankingRange==='custom' ? `${state.filters.customMin}–${state.filters.customMax}` : state.filters.rankingRange.replace("-","–")],
    ["Domain", Object.values(TAXONOMY).flat().find(d=>d.id===state.filters.domain)?.name.split(" (")[0] || "—"],
    ["University", state.selectedUniversity ? state.selectedUniversity.name.split(" ").slice(0,3).join(" ") : "—"],
    ["Professor", state.selectedProfessor ? state.selectedProfessor.name : "—"]
  ];
  document.getElementById("stepper").innerHTML = steps.map((s,i)=>{
    const active = (state.view==="home" && i<=2) || (state.view==="university-detail" && i<=3) || (state.view==="professor-profile");
    return `<div class="${active?'active':''}"><b>Step ${i+1}</b>${s[0]}: ${s[1]}</div>`;
  }).join("");
}

/* ============================= FILTER PANEL ============================= */
function renderFilters(){
  const domainOptions = Object.entries(TAXONOMY).map(([cat, domains])=>
    `<optgroup label="${cat}">` + domains.map(d=>`<option value="${d.id}" ${d.id===state.filters.domain?'selected':''}>${d.name}</option>`).join("") + `</optgroup>`
  ).join("");

  const currentDomain = Object.values(TAXONOMY).flat().find(d=>d.id===state.filters.domain);
  const subtopicChips = currentDomain && currentDomain.subtopics.length ? `
    <label>Subtopics (AI/ML) — search & filter</label>
    <input type="text" id="subtopicSearch" placeholder="Search subtopics, e.g. 'vision'">
    <div class="chips-wrap" id="subtopicChips"></div>
  ` : "";

  return `
    <div class="panel">
      <h3>1 · Country</h3>
      <label>Country</label>
      <select id="countrySelect">
        <option value="All" ${state.filters.country==='All'?'selected':''}>All countries</option>
        ${COUNTRIES.map(c=>`<option value="${c}" ${state.filters.country===c?'selected':''}>${c}</option>`).join("")}
      </select>
    </div>
    <div class="panel">
      <h3>2 · Ranking</h3>
      <label>Ranking system</label>
      <select disabled><option>QS World University Rankings by Subject</option></select>
      <label>Ranking range</label>
      <select id="rangeSelect">
        ${RANKING_BANDS.map(b=>`<option value="${b.min}-${b.max}" ${state.filters.rankingRange===`${b.min}-${b.max}`?'selected':''}>${b.label}</option>`).join("")}
        <option value="custom" ${state.filters.rankingRange==='custom'?'selected':''}>Custom range</option>
      </select>
      ${state.filters.rankingRange==='custom' ? `
      <div class="range-grid">
        <div><label>Min rank</label><input type="number" id="customMin" value="${state.filters.customMin}" min="1"></div>
        <div><label>Max rank</label><input type="number" id="customMax" value="${state.filters.customMax}" min="1"></div>
      </div>` : ""}
      <p class="note">This shows every rank slot in the chosen range — verified rows are real, sourced records; unverified rows are explicit "pending ingestion" placeholders, never fabricated universities.</p>
    </div>
    <div class="panel">
      <h3>3 · Academic Domain</h3>
      <label>Search or browse by category</label>
      <select id="domainSelect">${domainOptions}</select>
      ${subtopicChips}
      <p class="note">${currentDomain && currentDomain.unified ? "AI/ML is one unified domain — the items above are subtopics, never separate top-level domains." : ""}</p>
    </div>
  `;
}

function renderSubtopicChips(filterText=""){
  const currentDomain = Object.values(TAXONOMY).flat().find(d=>d.id===state.filters.domain);
  if(!currentDomain) return;
  const list = currentDomain.subtopics.filter(s=>s.toLowerCase().includes(filterText.toLowerCase()));
  document.getElementById("subtopicChips").innerHTML = list.map(s=>
    `<span class="subchip ${state.filters.subtopics.includes(s)?'on':''}" data-sub="${s}">${s}</span>`
  ).join("");
  document.querySelectorAll(".subchip").forEach(el=>{
    el.onclick = ()=>{
      const s = el.dataset.sub;
      const idx = state.filters.subtopics.indexOf(s);
      if(idx>-1) state.filters.subtopics.splice(idx,1); else state.filters.subtopics.push(s);
      renderApp();
    };
  });
}

/* ============================= UNIVERSITY LIST (pagination fix demo) ============================= */
const RANKING_BANDS = [
  { label:"World Ranking 1–100", min:1, max:100 },
  { label:"World Ranking 101–250", min:101, max:250 },
  { label:"World Ranking 251–500", min:251, max:500 },
  { label:"World Ranking 501–750", min:501, max:750 },
  { label:"World Ranking 751–1000", min:751, max:1000 },
  { label:"World Ranking 1001–1500", min:1001, max:1500 },
  { label:"World Ranking 1501+", min:1501, max:3000 }
];

function getRangeBounds(){
  if(state.filters.rankingRange === 'custom') return [Number(state.filters.customMin)||1, Number(state.filters.customMax)||1];
  const [min,max] = String(state.filters.rankingRange).split("-").map(Number);
  return [min||1, max||100];
}

function renderUniversityList(){
  const [min,max] = getRangeBounds();
  let rows = [];
  if(state.filters.country !== "All"){
    // Country filter: only show verified seeded matches — never claim a false total for the country.
    rows = SEED_UNIVERSITIES.filter(u => u.country===state.filters.country && u.rank>=min && u.rank<=max);
  } else {
    // No country filter: build the FULL numbered range so "Top 100" genuinely returns ranks 1..100,
    // filling any rank with no ingested record as an explicit pending row instead of guessing.
    const byRank = {};
    SEED_UNIVERSITIES.forEach(u=>{ (byRank[u.rank] = byRank[u.rank]||[]).push(u); });
    for(let r=min; r<=max; r++){
      if(byRank[r]) byRank[r].forEach(u=>rows.push(u));
      else rows.push({rank:r, pending:true});
    }
  }

  const verifiedCount = rows.filter(r=>!r.pending).length;
  const totalPages = Math.max(1, Math.ceil(rows.length / state.perPage));
  const pageRows = rows.slice((state.page-1)*state.perPage, state.page*state.perPage);

  return `
    <div class="results-head">
      <h2>Universities · Rank ${min}–${max} ${state.filters.country!=='All' ? '· '+state.filters.country : ''}</h2>
      <div class="count">${rows.length} rank slot${rows.length!==1?'s':''} in range — ${verifiedCount} verified record${verifiedCount!==1?'s':''}${state.filters.country==='All' ? ', ' + (rows.length-verifiedCount) + ' pending ingestion' : ''}</div>
      ${max>100 ? `<p class="note" style="margin-top:6px">Ranks 1–100 use the QS CS &amp; Information Systems subject ranking (2025). Ranks 102+ use the QS Overall/General World Ranking (2027) instead, since a verified subject-rank list beyond 100 isn't available yet — the two are not comparable. Each row below is labeled.</p>` : ''}
    </div>
    <table class="uni-table">
      <thead><tr><th style="width:60px">Rank</th><th>University</th><th style="width:110px">Country</th><th style="width:150px">Source</th></tr></thead>
      <tbody>
        ${pageRows.map(u => u.pending ? `
          <tr class="pending"><td class="rank-num">#${u.rank}</td><td colspan="3">Not yet verified — pending data ingestion for this rank slot</td></tr>
        ` : `
          <tr class="real" data-id="${u.id}"><td class="rank-num">#${u.rank}<br><small style="font-weight:400;opacity:.65">${RANK_SYSTEM_LABELS[u.rankSystem]?.short || ''}</small></td>
            <td class="uni-name">${u.name} ${u.website ? `<a href="${u.website}" target="_blank" rel="noopener" class="site-link" onclick="event.stopPropagation()" title="Open official university website">🔗</a>` : ''}<small>${u.city}</small></td>
            <td>${u.country}</td>
            <td>${badge("VERIFIED")}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
    <div class="pager">
      ${Array.from({length: totalPages}, (_,i)=>i+1).map(p=>`<button class="${p===state.page?'on':''}" data-page="${p}">${p}</button>`).join("")}
    </div>
    <p class="note" style="margin-top:14px">Ranking source: <a href="${RANKING_SOURCE.source_url}" target="_blank">${RANKING_SOURCE.source_name}</a> · ${RANKING_SOURCE.subject} · ${RANKING_SOURCE.year}.</p>
  `;
}

/* ============================= UNIVERSITY DETAIL ============================= */
function renderUniversityDetail(){
  const u = state.selectedUniversity;
  const [tab] = [state.detailTab || "overview"];
  const profs = PROFESSORS[u.id] || null;
  const currentDomain = Object.values(TAXONOMY).flat().find(d=>d.id===state.filters.domain);

  let profsHtml;
  if(!profs){
    profsHtml = `<div class="empty-state"><h4>No verified professors matching this research area were found.</h4>We have not yet ingested a verified faculty/research-group listing for ${u.name}. Nothing is fabricated to fill this space — check the official department page directly, or add this university to the ingestion queue.</div>`;
  } else {
    const scored = profs.map(p=>{
      const kwSets = state.filters.subtopics.length
        ? state.filters.subtopics.map(s=>SUBTOPIC_KEYWORDS[s]||[]).flat()
        : Object.values(SUBTOPIC_KEYWORDS).flat();
      const areaText = p.areas.join(" ").toLowerCase();
      let hits = kwSets.filter(k=>areaText.includes(k)).length;
      const score = Math.min(96, 40 + hits*14 + (p.publications.length*3));
      const reasons = [...new Set(kwSets.filter(k=>areaText.includes(k)))].slice(0,3);
      return {p, score, reasons};
    }).sort((a,b)=>b.score-a.score);

    profsHtml = `
      <p class="note" style="margin-bottom:14px">Researchers found: <b>${scored.length}</b> — sorted by AI-analyzed research relevance to ${currentDomain.name}${state.filters.subtopics.length ? ' → ' + state.filters.subtopics.join(", ") : ''}. Relevance scores are AI ANALYSIS, not verified fact.</p>
      ${scored.map(({p,score,reasons})=>`
        <div class="prof-card">
          <div class="prof-card-head">
            <div>
              <h4>${p.name}</h4>
              <div class="pos">${p.position} · ${p.dept}</div>
            </div>
            <div class="relevance">
              <div class="score">${score}%</div>
              <div class="reasons">AI ANALYSIS — ${reasons.length ? reasons.join(", ") : "general AI/ML alignment"}</div>
            </div>
          </div>
          <div class="tags">${p.areas.map(a=>`<span class="tag">${a}</span>`).join("")}</div>
          <div class="link-row">
            ${linkOrNA(p.officialProfile, "University faculty profile / website")}
            ${linkOrNA(p.groupPage, "Research group")}
            ${linkOrNA(p.scholar, "Google Scholar")}
            ${linkOrNA(p.orcid, "ORCID")}
            ${linkOrNA(p.github, "GitHub")}
            ${linkOrNA(p.email, "Email")}
          </div>
          <div class="link-row" style="margin-top:8px">
            <button class="btn" style="padding:6px 12px;font-size:12.5px" data-msgprof="${p.id}">Message professor</button>
            <p class="note" style="cursor:pointer;color:var(--accent);margin:0;align-self:center" data-openprof="${p.id}">View full profile →</p>
          </div>
        </div>
      `).join("")}
    `;
  }

  return `
    <span class="back-link" id="backToList">← Back to results</span>
    <div class="uni-header">
      <div>
        <h2>${u.name}</h2>
        <div class="meta">${u.city}, ${u.country} · ${RANK_SYSTEM_LABELS[u.rankSystem]?.short || 'QS'} rank #${u.rank}</div>
        ${u.website ? `<div style="margin-top:6px"><a href="${u.website}" target="_blank" rel="noopener">Visit official university website ↗</a></div>` : ''}
      </div>
      <div>${badge("VERIFIED")}</div>
    </div>
    <div class="tabs">
      <div class="tab ${tab==='overview'?'on':''}" data-tab="overview">Overview</div>
      <div class="tab ${tab==='rankings'?'on':''}" data-tab="rankings">Rankings</div>
      <div class="tab ${tab==='professors'?'on':''}" data-tab="professors">Professors / Researchers</div>
    </div>
    <div id="tabContent">
      ${tab==='overview' ? `
        <div class="panel">
          <h3>Overview</h3>
          <p style="font-size:13.5px;line-height:1.6">${u.name} is located in ${u.city}, ${u.country}. ${badge("VERIFIED")} Country and city are drawn from the ranking source below; program-level detail (Master's / Second Master's / PhD listings, scholarships, deadlines) requires per-university ingestion not yet performed for this prototype.</p>
          <div class="verif-box">Source: <a href="${RANKING_SOURCE.source_url}" target="_blank">${RANKING_SOURCE.source_name}</a> · Last verified: today's session lookup.</div>
        </div>
      ` : ""}
      ${tab==='rankings' ? `
        <div class="panel">
          <h3>Global Rankings</h3>
          <table class="uni-table"><thead><tr><th>System</th><th>Year</th><th>Subject</th><th>Rank</th><th>Source</th></tr></thead>
          <tbody><tr><td>${u.rankSystem==="QS_OVERALL_2027" ? "QS World University Rankings" : "QS World University Rankings by Subject"}</td><td>${u.rankSystem==="QS_OVERALL_2027" ? "2027" : "2025"}</td><td>${u.rankSystem==="QS_OVERALL_2027" ? "Overall / General Ranking (not subject-specific)" : "Computer Science and Information Systems"}</td><td class="rank-num">#${u.rank}</td><td>${badge("VERIFIED")}</td></tr></tbody></table>
          <p class="note">AI/ML has no dedicated QS subject ranking — "Computer Science and Information Systems" is shown as the closest mapped subject category. This mapping is explicit, not implied.</p>
        </div>
      ` : ""}
      ${tab==='professors' ? `<div class="panel">${profsHtml}</div>` : ""}
    </div>
  `;
}

function buildEmailDraft(p, uniName){
  const paperLine = p.publications.length
    ? `I recently came across your work, "${p.publications[0].title}" (${p.publications[0].venue}, ${p.publications[0].year}), which speaks directly to my interest in ${p.areas[0]}.`
    : `I've been following your work on ${p.areas[0]} at ${p.group}.`;
  return `Subject: Prospective graduate researcher — interest in ${p.areas[0]}

Dear Professor ${p.name.split(" ").slice(-1)[0]},

I am a prospective graduate applicant writing to express interest in joining ${p.group} at ${uniName}. ${paperLine}

[Insert: your academic background, relevant coursework/projects, and specific skills relevant to this group's work.]

[Insert: why this research direction and this group specifically — reference something concrete, not generic praise.]

I would welcome the chance to discuss potential Master's/PhD opportunities in your group. Thank you for your time and consideration.

Best regards,
[Your name]

— Note: this draft only references the publication(s) verified above. Do not add claims about the professor's work that are not sourced.`;
}

/* ============================= AUTH / MESSAGING (Supabase) ============================= */
function renderSetupBanner(){
  const el = document.getElementById("setupBanner");
  if(BACKEND_CONFIGURED){ el.innerHTML = ""; return; }
  el.innerHTML = `<div class="setup-banner">Backend not connected yet — browsing works, but registration and messaging are disabled. Paste your Supabase URL and anon key into <code>SUPABASE_URL</code> / <code>SUPABASE_ANON_KEY</code> near the top of the script and redeploy.</div>`;
}

function renderAuthBar(){
  const el = document.getElementById("authBar");
  if(!BACKEND_CONFIGURED){
    el.innerHTML = `<span class="who">Sign-in disabled — backend not configured</span>`;
    return;
  }
  if(currentUser){
    el.innerHTML = `<span class="who">${currentUser.email}</span><button id="logoutBtn">Log out</button>`;
    document.getElementById("logoutBtn").onclick = async ()=>{ await supabaseClient.auth.signOut(); };
  } else {
    el.innerHTML = `<button id="loginBtn">Log in</button><button class="primary" id="signupBtn">Register</button>`;
    document.getElementById("loginBtn").onclick = ()=>{ state.authModal="login"; state.authError=""; renderApp(); };
    document.getElementById("signupBtn").onclick = ()=>{ state.authModal="signup"; state.authError=""; renderApp(); };
  }
}

function renderNavTabs(){
  const el = document.getElementById("navTabs");
  const tabs = [["home","Discover"],["scholarships","Scholarships"],["outbox","My Outbox"]];
  el.innerHTML = tabs.map(([id,label])=>`<div class="nt ${state.navView===id?'on':''}" data-nav="${id}">${label}</div>`).join("");
  el.querySelectorAll(".nt").forEach(t=>{
    t.onclick = ()=>{
      state.navView = t.dataset.nav;
      if(state.navView==="outbox"){ state.view="outbox"; navigateTo("/outbox","My Outbox"); loadOutbox(); }
      else if(state.navView==="scholarships"){ state.view="scholarships"; navigateTo("/scholarships","Scholarships"); }
      else { state.view="home"; navigateTo("/","AcadNova"); }
      renderApp();
    };
  });
}

const GENERIC_APPLICATION_STEPS = [
  "Check eligibility", "Select scholarship/programme", "Prepare required documents",
  "Create an account on the official portal", "Complete the online application", "Upload documents",
  "Submit application", "Track application status", "Attend interview, if required", "Receive scholarship decision"
];

function scholarshipFundBadges(s){
  const flags = [
    ["Tuition", s.tuitionCoverage ? true : false],
    ["Stipend", s.fullyFundedStatus],
    ["Accommodation", s.accommodation],
    ["Travel/Airfare", s.travel],
    ["Health Insurance", s.healthInsurance],
    ["Visa Support", s.visaSupport]
  ];
  return flags.map(([label,on])=>`<span class="source-badge" style="background:${on?'var(--verified-bg)':'var(--unverified-bg)'};color:${on?'var(--verified)':'var(--unverified)'};margin-right:4px">${label}${on?' ✓':' —'}</span>`).join("");
}

function renderScholarshipsView(){
  const f = state.scholarshipFilters;
  let rows = SCHOLARSHIPS;
  if(f.degreeLevel !== "All") rows = rows.filter(s=>s.degreeLevel===f.degreeLevel);
  if(f.fundingType !== "All") rows = rows.filter(s=>s.fundingType===f.fundingType);

  return `
    <div class="panel">
      <h3>Global Scholarship Index ${SCHOLARSHIPS.length ? `(${SCHOLARSHIPS.length} verified programmes)` : ''}</h3>
      <p class="note" style="margin-bottom:12px">Core facts (name, provider, country, degree level, official links) are sourced from each programme's official site. Amounts, exact dates, and eligible-country lists change every cycle — always confirm the current details on the official link before applying.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
        <select id="scholarshipDegreeSelect">
          <option value="All" ${f.degreeLevel==='All'?'selected':''}>All degree levels</option>
          ${SCHOLARSHIP_DEGREE_LEVELS.map(d=>`<option value="${d}" ${f.degreeLevel===d?'selected':''}>${d}</option>`).join("")}
        </select>
        <select id="scholarshipTypeSelect">
          <option value="All" ${f.fundingType==='All'?'selected':''}>All funding categories</option>
          ${SCHOLARSHIP_CATEGORIES.map(c=>`<option value="${c}" ${f.fundingType===c?'selected':''}>${c}</option>`).join("")}
        </select>
      </div>
      <div class="count" style="margin-bottom:10px">${rows.length} scholarship${rows.length!==1?'s':''} match${rows.length===1?'es':''} this filter</div>
      ${rows.length ? rows.map(s=>`
        <div class="pub-item">
          <div class="t">${s.name} — ${s.provider}</div>
          <div class="m">${s.country} · ${s.region} · ${s.degreeLevel} · ${s.fundingType}</div>
          <div style="margin:6px 0">${scholarshipFundBadges(s)}</div>
          <div class="m">Eligibility: ${s.eligibility}</div>
          <div class="m">Duration: ${s.duration}</div>
          <div class="m">Deadline: ${s.applicationDeadline}</div>
          <div class="m">${linkOrNA({url:s.officialInfoURL},"Official info")} · ${linkOrNA({url:s.officialApplicationURL},"Official application")} ${badge(s.verificationStatus)}</div>
          <div class="m" style="opacity:0.7">Core facts last checked: ${s.lastVerifiedDate}</div>
        </div>
      `).join("") : `<div class="empty-state"><h4>No scholarships match this filter</h4>Try a different degree level or funding category.</div>`}
    </div>
    <div class="panel">
      <h3>Typical application process</h3>
      <p class="note" style="margin-bottom:10px">This is a general step sequence common to most scholarship applications — it is not specific to any single scholarship or university, and exact steps always vary by program.</p>
      <ol style="margin:0;padding-left:20px;font-size:13.5px;line-height:1.9">
        ${GENERIC_APPLICATION_STEPS.map(s=>`<li>${s}</li>`).join("")}
      </ol>
    </div>
  `;
}

function bindScholarshipEvents(){
  document.getElementById("scholarshipDegreeSelect").onchange = e=>{ state.scholarshipFilters.degreeLevel = e.target.value; renderApp(); };
  document.getElementById("scholarshipTypeSelect").onchange = e=>{ state.scholarshipFilters.fundingType = e.target.value; renderApp(); };
}

function renderAuthModal(){
  const root = document.getElementById("modalRoot");
  if(!state.authModal){ root.innerHTML=""; return; }
  const isSignup = state.authModal==="signup";
  root.innerHTML = `
    <div class="modal-overlay" id="authOverlay">
      <div class="modal-box">
        <h3>${isSignup ? "Register" : "Log in"}</h3>
        <label>Email</label><input type="text" id="authEmail">
        <label>Password</label><input type="text" id="authPassword" placeholder="At least 6 characters">
        ${state.authError ? `<div class="field-error">${state.authError}</div>` : ""}
        <div class="actions">
          <button id="authCancel">Cancel</button>
          <button class="primary" id="authSubmit">${isSignup ? "Create account" : "Log in"}</button>
        </div>
      </div>
    </div>`;
  document.getElementById("authOverlay").onclick = (e)=>{ if(e.target.id==="authOverlay"){ state.authModal=null; renderApp(); } };
  document.getElementById("authCancel").onclick = ()=>{ state.authModal=null; renderApp(); };
  document.getElementById("authSubmit").onclick = async ()=>{
    const email = document.getElementById("authEmail").value.trim();
    const password = document.getElementById("authPassword").value;
    if(!email || password.length<6){ state.authError="Enter a valid email and a password of at least 6 characters."; renderApp(); return; }
    const fn = isSignup ? supabaseClient.auth.signUp : supabaseClient.auth.signInWithPassword;
    const { error } = await fn.call(supabaseClient.auth, { email, password });
    if(error){ state.authError = error.message; renderApp(); return; }
    state.authModal = null; state.authError="";
    renderApp();
  };
}

function renderMessageModal(){
  const root2 = document.getElementById("modalRoot2") || (()=>{ const d=document.createElement("div"); d.id="modalRoot2"; document.body.appendChild(d); return d; })();
  const p = state.messageModalProfessor;
  if(!p){ root2.innerHTML=""; return; }
  if(!currentUser){
    root2.innerHTML = `<div class="modal-overlay" id="msgOverlay"><div class="modal-box">
      <h3>Log in required</h3>
      <p class="note">Register or log in first so your message to ${p.name} is saved to your account.</p>
      <div class="actions"><button id="msgCancel">Close</button><button class="primary" id="goLogin">Log in</button></div>
    </div></div>`;
    document.getElementById("msgOverlay").onclick=(e)=>{ if(e.target.id==="msgOverlay"){ state.messageModalProfessor=null; renderApp(); } };
    document.getElementById("msgCancel").onclick=()=>{ state.messageModalProfessor=null; renderApp(); };
    document.getElementById("goLogin").onclick=()=>{ state.messageModalProfessor=null; state.authModal="login"; renderApp(); };
    return;
  }
  root2.innerHTML = `<div class="modal-overlay" id="msgOverlay"><div class="modal-box">
    <h3>Message ${p.name}</h3>
    <label>Your message</label>
    <textarea id="msgText" style="min-height:140px">${buildEmailDraft(p, state.selectedUniversity ? state.selectedUniversity.name : "")}</textarea>
    ${p.email ? `<p class="note">${p.name} has a publicly verified email — this will also be saved as ready to send via your own email client.</p>` : `<p class="note">${p.name} has no publicly verified email yet — your message is saved to your outbox for your own records; sending will need to happen once a verified contact is available.</p>`}
    <div class="actions"><button id="msgCancel2">Cancel</button><button class="primary" id="msgSend">Save to outbox</button></div>
  </div></div>`;
  document.getElementById("msgOverlay").onclick=(e)=>{ if(e.target.id==="msgOverlay"){ state.messageModalProfessor=null; renderApp(); } };
  document.getElementById("msgCancel2").onclick=()=>{ state.messageModalProfessor=null; renderApp(); };
  document.getElementById("msgSend").onclick=async ()=>{
    const text = document.getElementById("msgText").value.trim();
    if(!text) return;
    await saveMessageToOutbox(p, text);
    state.messageModalProfessor=null;
    renderApp();
  };
}

async function saveMessageToOutbox(p, text){
  if(!BACKEND_CONFIGURED || !currentUser) return;
  await supabaseClient.from("professor_contacts").insert({
    user_id: currentUser.id,
    professor_id: p.id || p.name,
    professor_name: p.name,
    university_name: state.selectedUniversity ? state.selectedUniversity.name : "",
    message: text,
    contact_method: p.email ? "mailto" : "in_app_outbox"
  });
}

async function loadOutbox(){
  if(!BACKEND_CONFIGURED || !currentUser){ state.outboxItems = []; return; }
  state.outboxLoading = true; renderApp();
  const { data, error } = await supabaseClient
    .from("professor_contacts")
    .select("*")
    .order("created_at", { ascending:false });
  state.outboxItems = error ? [] : data;
  state.outboxLoading = false;
  renderApp();
}

function renderOutboxView(){
  if(!BACKEND_CONFIGURED){
    return `<div class="empty-state"><h4>Backend not configured</h4>Connect Supabase to enable your outbox.</div>`;
  }
  if(!currentUser){
    return `<div class="empty-state"><h4>Log in to see your outbox</h4>Messages you send to professors are saved to your account only — nobody else can see them.</div>`;
  }
  if(state.outboxLoading || state.outboxItems===null){
    return `<p class="note">Loading your messages…</p>`;
  }
  if(state.outboxItems.length===0){
    return `<div class="empty-state"><h4>No messages yet</h4>Open a professor's profile or card and click "Message professor" to get started.</div>`;
  }
  return state.outboxItems.map(m=>`
    <div class="outbox-item">
      <b>${m.professor_name}</b> · ${m.university_name}
      <span class="status-pill ${m.contact_method==='mailto'?'mailto':'saved'}" style="margin-left:8px">${m.contact_method==='mailto' ? 'Ready to send (verified email)' : 'Saved — no verified email yet'}</span>
      <div class="m">${m.message}</div>
      <div class="m">${new Date(m.created_at).toLocaleString()}</div>
    </div>
  `).join("");
}

/* ============================= MAIN RENDER ============================= */
function renderApp(){
  renderSetupBanner();
  renderAuthBar();
  renderNavTabs();
  renderStepper();
  const root = document.getElementById("root");

  if(state.view === "outbox"){
    root.innerHTML = `<div class="panel"><h3>My Outbox</h3><p class="note" style="margin-bottom:14px">Messages you've sent to professors, saved to your account.</p>${renderOutboxView()}</div>`;
  } else if(state.view === "scholarships"){
    root.innerHTML = renderScholarshipsView();
    bindScholarshipEvents();
  } else if(state.view === "home"){
    root.innerHTML = `<div class="layout"><div>${renderFilters()}</div><div>${renderUniversityList()}</div></div>`;
    bindHomeEvents();
    if(document.getElementById("subtopicChips")) renderSubtopicChips();
  } else if(state.view === "university-detail"){
    root.innerHTML = renderUniversityDetail();
    bindDetailEvents();
  } else if(state.view === "professor-profile"){
    root.innerHTML = renderProfessorProfile();
    document.getElementById("emailDraft").value = buildEmailDraft(state.selectedProfessor, state.selectedUniversity.name);
    document.getElementById("backToUni").onclick = ()=>{
      state.view="university-detail"; state.detailTab="professors";
      navigateTo(`/universities/${state.selectedUniversity.id}`, state.selectedUniversity.name);
      renderApp();
    };
    document.getElementById("sendMsgBtn").onclick = ()=>{
      state.messageModalProfessor = state.selectedProfessor;
      renderApp();
    };
    if(document.getElementById("mailtoLink")){
      // Populated only when a professor record has a verified public email; the field stores
      // a ready-to-use "mailto:address" link — never a guessed address.
      const p = state.selectedProfessor;
      const base = p.email?.url?.startsWith("mailto:") ? p.email.url : `mailto:${p.email?.url || ''}`;
      document.getElementById("mailtoLink").href = `${base}?subject=${encodeURIComponent('Prospective graduate researcher')}&body=${encodeURIComponent(document.getElementById("emailDraft").value)}`;
    }
  }

  renderAuthModal();
  renderMessageModal();
  bindMessageButtons();
}

function bindMessageButtons(){
  document.querySelectorAll("[data-msgprof]").forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const id = btn.dataset.msgprof;
      const list = PROFESSORS[state.selectedUniversity.id] || [];
      state.messageModalProfessor = list.find(p=>p.id===id);
      renderApp();
    };
  });
}

function bindHomeEvents(){
  document.getElementById("countrySelect").onchange = e=>{ state.filters.country=e.target.value; state.page=1; renderApp(); };
  document.getElementById("rangeSelect").onchange = e=>{
    state.filters.rankingRange = e.target.value;
    state.page=1; renderApp();
  };
  const cmin=document.getElementById("customMin"), cmax=document.getElementById("customMax");
  if(cmin) cmin.onchange = e=>{ state.filters.customMin=e.target.value; state.page=1; renderApp(); };
  if(cmax) cmax.onchange = e=>{ state.filters.customMax=e.target.value; state.page=1; renderApp(); };
  document.getElementById("domainSelect").onchange = e=>{ state.filters.domain=e.target.value; state.filters.subtopics=[]; renderApp(); };
  const ss = document.getElementById("subtopicSearch");
  if(ss) ss.oninput = e=>renderSubtopicChips(e.target.value);

  document.querySelectorAll("tr.real").forEach(row=>{
    row.onclick = ()=>{
      const id = row.dataset.id;
      state.selectedUniversity = SEED_UNIVERSITIES.find(u=>u.id===id);
      state.view = "university-detail";
      state.detailTab = "overview";
      navigateTo(`/universities/${id}`, state.selectedUniversity.name);
      renderApp();
    };
  });
  document.querySelectorAll(".pager button").forEach(b=>{
    b.onclick = ()=>{ state.page = Number(b.dataset.page); renderApp(); };
  });
}

function bindDetailEvents(){
  document.getElementById("backToList").onclick = ()=>{ state.view="home"; state.selectedUniversity=null; navigateTo("/", "AcadNova"); renderApp(); };
  document.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state.detailTab = t.dataset.tab; renderApp(); };
  });
  document.querySelectorAll("[data-openprof]").forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.openprof;
      const list = PROFESSORS[state.selectedUniversity.id] || [];
      state.selectedProfessor = list.find(p=>p.id===id);
      state.view = "professor-profile";
      navigateTo(`/professors/${id}`, state.selectedProfessor.name);
      renderApp();
    };
  });
}

applyRouteFromLocation();
if(state.selectedProfessor) document.title = state.selectedProfessor.name + " — AcadNova";
else if(state.selectedUniversity) document.title = state.selectedUniversity.name + " — AcadNova";
if(BACKEND_CONFIGURED){ initAuth(); } else { renderApp(); }
</script>
</body>
</html>
