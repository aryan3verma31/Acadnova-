# Netlify build/deploy configuration.
# This file is what makes Git-based auto-deploy and clean URL routing work.

[build]
  publish = "."

# SPA fallback: any path (e.g. /professors/andreas-krause) that doesn't match a real
# file gets served index.html instead of a 404. The app's own router (applyRouteFromLocation
# in index.html) then reads location.pathname and shows the right view. This is what makes
# "refresh a deep link" work correctly (spec requirement: no 404 on refresh).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers. Netlify serves everything over HTTPS automatically and redirects
# HTTP -> HTTPS by default; this adds HSTS and basic hardening on top of that.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
